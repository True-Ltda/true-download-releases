<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="YANG, criador do True">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.6" stop-color="#0b0904"/>
      <stop offset="1" stop-color="#2a1f06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5c542" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f5c542" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.5" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#d49b12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="22"/></clipPath>
    <style>
      .pulse { animation: pulse 4s ease-in-out infinite; transform-origin: 960px 150px; }
      @keyframes pulse { 0%, 100% { opacity: .75; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
      .label { font: 600 14px "Segoe UI", system-ui, sans-serif; letter-spacing: 6px; fill: #f5c542; }
      .name { font: 800 118px "Segoe UI", system-ui, sans-serif; letter-spacing: 6px; fill: #ffffff; }
      .sub { font: 400 22px "Segoe UI", system-ui, sans-serif; fill: #b9b9b9; }
      .chip { font: 600 13px "Segoe UI", system-ui, sans-serif; fill: #f5c542; }
      .kanji { font: 700 190px "Yu Mincho", "MS Mincho", "Noto Serif CJK JP", serif; fill: url(#gold); }
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle class="pulse" cx="960" cy="150" r="190" fill="url(#glow)"/>
    <circle cx="960" cy="150" r="104" fill="none" stroke="#f5c542" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="960" cy="150" r="132" fill="none" stroke="#f5c542" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3 9"/>
    <text class="kanji" x="960" y="215" text-anchor="middle">真</text>
    <rect x="70" y="58" width="46" height="3" rx="1.5" fill="url(#gold)"/>
    <text class="label" x="70" y="96">CRIADOR DO TRUE</text>
    <text class="name" x="66" y="198">YANG</text>
    <text class="sub" x="70" y="240">Downloads rápidos, bonitos e seguros para Windows.</text>
    <g transform="translate(70 258)">
      <rect width="62" height="26" rx="13" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.45"/><text class="chip" x="31" y="18" text-anchor="middle">Rust</text>
      <rect x="72" width="64" height="26" rx="13" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.45"/><text class="chip" x="104" y="18" text-anchor="middle">Tauri</text>
      <rect x="146" width="104" height="26" rx="13" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.45"/><text class="chip" x="198" y="18" text-anchor="middle">JavaScript</text>
      <rect x="260" width="90" height="26" rx="13" fill="#f5c542" fill-opacity="0.12" stroke="#f5c542" stroke-opacity="0.45"/><text class="chip" x="305" y="18" text-anchor="middle">Supabase</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="21.5" fill="none" stroke="#f5c542" stroke-opacity="0.25" stroke-width="1.5"/>
</svg>
